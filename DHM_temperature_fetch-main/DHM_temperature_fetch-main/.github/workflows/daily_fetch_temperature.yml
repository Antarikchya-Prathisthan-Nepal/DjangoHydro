name: Fetch DHM Daily Temperature

on:
  schedule:
    - cron: '15 8 * * */2' 
  workflow_dispatch:

jobs:
  fetch-temperature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml gspread gspread_dataframe

      - name: Setup Google service account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_TEMPERATURE }}' > service_account.json

      - name: Run fetch_temperature.py
        run: python fetch_temperature.py
