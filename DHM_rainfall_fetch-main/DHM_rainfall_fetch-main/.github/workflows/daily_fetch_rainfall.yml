name: Fetch DHM Daily Rainfall

on:
  schedule:
    - cron: '15 12 * * *' 
  workflow_dispatch:

jobs:
  fetch-rainfall:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml gspread gspread_dataframe

      - name: Setup Google service account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_2 }}' > service_account.json

      - name: Run fetch_rainfall.py
        run: python fetch_rainfall.py
