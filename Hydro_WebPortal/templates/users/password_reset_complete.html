<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | Hydro WebPortal</title>
    {% load static %}
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/alerts.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal_close.css' %}">
    
    <style>
        .reset-container {
            width: 100%;
            max-width: 450px;
        }
        
        .reset-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            color: white;
        }
        
        .reset-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }
        
        .reset-info {
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #4a90e2;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
            color: #75a9e6;
        }
        
        .success-icon {
            text-align: center;
            font-size: 48px;
            color: #27ae60;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="standalone-login-page">
        <div class="container h-100 d-flex align-items-center justify-content-center">
            <div class="reset-container">
                <div class="reset-card">
                    <button type="button" class="btn-close" aria-label="Close" onclick="window.location.href='{% url 'home' %}'"></button>
                    
                    <div class="success-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    
                    <h2 class="reset-title">Password Reset Complete!</h2>
                    <p class="reset-info">Your password has been successfully reset. You can now log in with your new password.</p>
                    
                    <a href="{% url 'users:login' %}" class="signin-btn" style="display: block; text-align: center; text-decoration: none;">Log In Now</a>
                    
                    <a href="{% url 'home' %}" class="back-link">
                        <i class="fas fa-home me-2"></i>Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
