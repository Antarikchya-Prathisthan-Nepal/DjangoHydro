<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified | Hydro WebPortal</title>
    {% load static %}
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        .info-card {
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px 35px;
            color: white;
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .icon-circle {
            width: 70px; height: 70px;
            border-radius: 50%;
            background-color: rgba(39,174,96,0.15);
            border: 2px solid #27ae60;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px; color: #27ae60;
        }
        .info-title { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: white; }
        .info-text  { color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 28px; }
        .action-btn {
            display: inline-block; padding: 11px 30px;
            background-color: #dc1a22; color: white;
            border: none; border-radius: 4px; font-weight: 600;
            text-decoration: none; transition: background-color 0.3s;
        }
        .action-btn:hover { background-color: #b8151c; color: white; }
    </style>
</head>
<body>
<div class="standalone-login-page">
    <div class="info-card">
        <div class="icon-circle"><i class="fas fa-check"></i></div>
        <h2 class="info-title">Email Verified!</h2>
        <p class="info-text">
            Your email address has been successfully verified.<br><br>
            Your account is now <strong>pending administrator approval</strong>.
            You will be able to log in once an administrator reviews and approves your registration.
        </p>
        <a href="{% url 'users:login' %}" class="action-btn">Go to Login</a>
    </div>
</div>
</body>
</html>
