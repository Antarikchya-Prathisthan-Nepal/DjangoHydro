
name: DHM Wind Daily Fetch

on:
  schedule:
    - cron: '15 6 * * */2' 
  workflow_dispatch:

jobs:
  fetch-wind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml gspread gspread_dataframe

      - name: Setup Google service account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_WIND }}' > service_account.json

      - name: Run fetch_wind.py
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          DHM_WIND_SHEET: DHM_wind
          GSHEET_MAX_RETRIES: 6
          GSHEET_RETRY_BASE_SECONDS: 3
          GSHEET_WRITE_DELAY_SECONDS: 1.0
        run: python fetch_wind.py
